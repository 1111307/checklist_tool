# ============================================
# 数据库/中间件连接配置（麒麟/Linux）
# 各核查脚本会读取本文件获取连接参数
# 优先级：环境变量 > 本文件 > 脚本默认值
# 修改后保存即可，无需改脚本
# ============================================

# MySQL / MariaDB
MYSQL_HOST=127.0.0.1
MYSQL_PORT=3306
MYSQL_USER=root
MYSQL_PASS=

# Redis
REDIS_HOST=127.0.0.1
REDIS_PORT=6379
REDIS_PASS=

# 达梦 DM8
DM_HOST=127.0.0.1
DM_PORT=5236
DM_USER=SYSDBA
DM_PASS=SYSDBA

# SQL Server
MSSQL_HOST=127.0.0.1
MSSQL_PORT=1433
MSSQL_USER=sa
MSSQL_PASS=
